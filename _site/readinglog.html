  }

  .reading-log-title {

    font-style: normal;
    line-height: 1;

    color: var(--ink);
    text-align: center;
  }

  .year-section {
    position: relative;
    margin-bottom: 92px;
    padding-top: 42px;
  }

  .year-tab {
    position: absolute;
    top: 0;
    left: 38px;
    z-index: 2;

    display: flex;
    align-items: center;
    justify-content: center;

    height: 56px;
    padding: 0 32px;
    border-radius: 17px 17px 0 0;
  }

  .year-tab-title {
    display: block;

    font-family: "CustomFont", Georgia, serif;
    font-size: clamp(1.9rem, 2.3vw, 2.7rem);
    font-weight: normal;
    font-style: normal;
    line-height: 1;
    letter-spacing: 0.01em;

    color: var(--ink);
    white-space: nowrap;
  }

  .year-panel {
    padding: 38px 34px 34px;
    border-top: 1px solid var(--line);
  }

  /* Year colour themes */

  .year-sage .year-tab {
    background: var(--sage-tab);
  }

  .year-sage .year-panel {
    background: linear-gradient(
      180deg,
      rgba(184, 189, 169, 0.22) 0%,
      rgba(247, 244, 238, 0) 100%
    );
  }

  .year-sage .book-cover-wrap {
    border-color: rgba(168, 174, 155, 0.58);
  }

    background: var(--sage-hover);
  }

  .year-sage .star-rating .full,

    color: #7F8774;
  }

  .year-blue .year-tab {
    background: var(--blue-tab);
  }

  .year-blue .year-panel {

  .year-blue .star-rating .full,

  .year-peach .star-rating .full,

    color: #A27B6C;
  }

  .year-olive .year-tab {

  }

  .year-olive .year-panel {

  .year-olive .star-rating .full,
  .year-olive .star-rating .half {
    color: #8F8B70;
  }

  .reading-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
    gap: 30px 24px;
  }

  .book {
    margin: 0;
    text-align: center;
  }

  .book-cover-wrap {
    display: block;
    padding: 10px;

    background: var(--paper);
    border: 1px solid;
    border-radius: 16px;

    transition:
      transform 0.18s ease,
      background-color 0.18s ease,
      box-shadow 0.18s ease;
  }

  .book-cover-wrap:hover {
    box-shadow: 0 8px 18px rgba(80, 80, 70, 0.10);
    transform: translateY(-3px);
  }

  .book-image {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 3;

    object-fit: cover;
    border-radius: 10px;
    background: #EEE9E0;
  }

  .star-rating {
    display: flex;
    justify-content: center;
    gap: 3px;
    margin-top: 11px;

    font-family: Arial, sans-serif;
    font-size: 1.12rem;
    line-height: 1;
  }

  .star-rating .half {
    background: linear-gradient(
      to right,
      currentColor 50%,
      var(--star-empty) 50%
    );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  .star-rating .empty {
    color: var(--star-empty);
  }

  .empty-reading-log {
    padding: 28px;

    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--paper);

    font-family: "CustomFont", Georgia, serif;
    font-size: 1.15rem;
  }

  @media (max-width: 900px) {
    .reading-grid {
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 24px 18px;
    }
  }

  @media (max-width: 700px) {
    .reading-log-title {
      margin-bottom: 60px;
      font-size: clamp(4rem, 15vw, 7rem);

    .year-tab {
      left: 20px;
      height: 48px;
      padding: 0 24px;
      border-radius: 14px 14px 0 0;

    .year-tab-title {

    .year-panel {

    .reading-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px 14px;
    }

    .book-cover-wrap {
      padding: 7px;
      border-radius: 12px;
    }

    .book-image {
      border-radius: 8px;
    }

</style>
