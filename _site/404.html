    top: 0;

    font-style: normal;

  }

  .site-nav-links a:hover {
    background: var(--nav-hover);
    transform: translateY(-1px);
    color: var(--nav-ink);
    text-decoration: none;
  }

  .site-nav-links a:focus {
    color: var(--nav-ink);
