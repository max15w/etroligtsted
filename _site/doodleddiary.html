<style>
  :root {
    --nav-background: #F4F1EB;
    --nav-active: #D4D0C6;
    --nav-hover: #E7E1D6;
    --nav-line: rgba(52, 49, 46, 0.10);
    --nav-shadow: rgba(70, 62, 52, 0.08);
    --nav-ink: #554D46;
  }

  .site-nav {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;

    width: 100%;
    min-height: 56px;

    background: rgba(238, 233, 224, 0.97);
    border-bottom: 1px solid var(--nav-line);
    box-shadow: 0 3px 10px var(--nav-shadow);

    font-family: "CustomFont", Georgia, serif;
  }

  .site-nav-inner {
    width: min(1240px, calc(100% - 48px));
    min-height: 56px;
    margin: 0 auto;

    display: flex;
    align-items: center;
  }

  .site-nav-links {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;

    list-style: none;
    margin: 0;
    padding: 0;
  }

  .site-nav-links li {
    margin: 0;
    padding: 0;
  }

  .site-nav-links a {
    display: flex;
    align-items: center;
    justify-content: center;

    height: 40px;
    padding: 0 14px;

    border-radius: 11px;
    text-decoration: none;

    color: var(--nav-ink);
    font-family: "CustomFont", Georgia, serif;
    font-size: 1.65rem;
    font-weight: normal;
    font-style: normal;
    line-height: 1;
    letter-spacing: 0.01em;
    white-space: nowrap;

    transition:
      background-color 0.18s ease,
      transform 0.18s ease;
  }

  .site-nav-links a:hover {
    background: var(--nav-hover);
    transform: translateY(-1px);
    color: var(--nav-ink);
    text-decoration: none;
  }

  .site-nav-links a:focus {
    color: var(--nav-ink);
    text-decoration: none;
  }

  .site-nav-links a.active {
    background: var(--nav-active);
  }

  .nav-home {
    font-size: 1.55rem;
  }

  @media (max-width: 780px) {
    .site-nav {
      min-height: 50px;
    }

    .site-nav-inner {
      width: min(100% - 24px, 1240px);
      min-height: 50px;
    }

    .site-nav-links {
      gap: 4px;
    }

    .site-nav-links a {
      height: 36px;
      padding: 0 9px;
      border-radius: 9px;
      font-size: 1.3rem;
    }

    .nav-home {
      font-size: 1.25rem;
    }
  }
</style>
