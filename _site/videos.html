<script>
  // Turn YouTube links into embeds. Supports watch?v=, youtu.be/, and shorts/
  (function () {
    function extractYouTubeID(url) {
      try {
        var u = new URL(url);
        if (u.hostname.includes('youtu.be')) {
          return u.pathname.slice(1);
        }
        if (u.pathname.startsWith('/shorts/')) {
          return u.pathname.split('/')[2];
        }
        if (u.searchParams.get('v')) {
          return u.searchParams.get('v');
        }
        // Fallback: try last path segment
        var parts = u.pathname.split('/');
        return parts.pop() || parts.pop();
      } catch (e) { return null; }
    }

    function makeEmbed(id) {
      // privacy-enhanced embed
      var src = "https://www.youtube-nocookie.com/embed/" + id + "?rel=0";
      var iframe = document.createElement('iframe');
      iframe.setAttribute('src', src);
      iframe.setAttribute('allow',
        'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
      iframe.setAttribute('allowfullscreen', 'true');
      return iframe;
    }

    document.querySelectorAll('.player[data-url]').forEach(function (box) {
      var id = extractYouTubeID(box.getAttribute('data-url'));
      if (!id) return;
      box.innerHTML = '';
      box.appendChild(makeEmbed(id));
    });
  })();
</script>
