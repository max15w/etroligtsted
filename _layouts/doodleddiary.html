---
layout: default
---

<style>
  html,
  body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #F7F4EE !important;
    background-image: none !important;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    box-sizing: border-box;
  }

  .doodleddiary-page {
    width: 100%;
    min-height: 100vh;

    /*
      Top padding accounts for the fixed navigation bar.
      Without this, the page title sits underneath the header.
    */
    padding: 90px 0 120px;

    background: #F7F4EE;
  }

  .doodleddiary-content {
    width: 100%;
    margin: 0 auto;
    background: transparent;
  }

  footer {
    width: 100%;
    margin-top: auto;
    padding: 20px 0;

    background-color: rgba(34, 34, 34, 0.8);
    color: white;
    text-align: center;
  }

  @media (max-width: 700px) {
    .doodleddiary-page {
      padding: 72px 0 80px;
    }
  }
</style>

<main class="doodleddiary-page">
  <div class="doodleddiary-content">
    {{ content }}
  </div>
</main>
