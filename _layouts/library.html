---
layout: default
---

<style>
  :root {
    --cream: #F4F1EB;
    --ink: #34312E;
  }

  body {
    background: var(--cream) !important;
    background-image: none !important;
    margin: 0;
    padding: 0;
    color: var(--ink);
  }

  .library-layout {
    width: min(1240px, calc(100% - 48px));
    margin: 0 auto;
    padding: 82px 0 110px;
  }

  @media (max-width: 700px) {
    .library-layout {
      width: min(100% - 28px, 1240px);
      padding: 74px 0 80px;
    }
  }
</style>

<main class="library-layout">
  {{ content }}
</main>
