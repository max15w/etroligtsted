<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {{ site.title }} -
    {% if page.title %}
      {{ page.title | escape }}
    {% else %}
      {{ site.title | escape }}
    {% endif %}
  </title>

  <meta
    name="description"
    content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}"
  >

  <style>
    @font-face {
      font-family: "CustomFont";
      src: url("{{ '/fonts/Rons.ttf' | relative_url }}") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
  </style>

  <link
    rel="stylesheet"
    href="{{ '/css/main.css' | relative_url }}"
  >

  <link
    rel="canonical"
    href="{{ page.url | replace: 'index.html', '' | absolute_url }}"
  >

  {% if jekyll.environment == 'production' %}
    {% include analytics.html %}
  {% endif %}
</head>
